apiVersion: batch/v1
kind: CronJob

metadata:
  name: kubernetes-cronjob
  namespace: devops-learning

spec:
  schedule: "*/5 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
            - name: cronjob
              image: busybox:1.36

              command:
                - sh
                - -c
                - "date; echo Kubernetes CronJob executed"
