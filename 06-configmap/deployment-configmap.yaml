apiVersion: apps/v1
kind: Deployment

metadata:
  name: configmap-demo
  namespace: devops-learning

spec:
  replicas: 2

  selector:
    matchLabels:
      app: configmap-demo

  template:
    metadata:
      labels:
        app: configmap-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: APP_NAME

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: ENVIRONMENT
