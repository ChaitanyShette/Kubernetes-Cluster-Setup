apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-rolling-update
  namespace: devops-learning

spec:
  replicas: 3

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: nginx-rolling

  template:
    metadata:
      labels:
        app: nginx-rolling

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
