apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nginx-stateful
  namespace: devops-learning

spec:
  serviceName: nginx-headless
  replicas: 2

  selector:
    matchLabels:
      app: nginx-stateful

  template:
    metadata:
      labels:
        app: nginx-stateful

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - containerPort: 80
