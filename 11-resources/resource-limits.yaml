apiVersion: apps/v1
kind: Deployment

metadata:
  name: resource-demo
  namespace: devops-learning

spec:
  replicas: 2

  selector:
    matchLabels:
      app: resource-demo

  template:
    metadata:
      labels:
        app: resource-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
